name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python application
        run: python -m compileall -q app.py tests
      - name: Run PDF feature tests
        run: python -m unittest discover -s tests -v
      - name: Verify Flask routes load
        run: |
          python -c "from app import app; expected = {'/api/pdf-to-word', '/api/ocr', '/api/compress', '/api/protect', '/api/unlock'}; actual = {rule.rule for rule in app.url_map.iter_rules()}; missing = expected - actual; assert not missing, f'Missing routes: {missing}'; print('App imports and PDF feature routes are registered.')"
